name: Linux arm64 startup diagnostic

# Temporary: measures why the Linux arm64 PGSO candidate from run 40946867920
# starts slower than the ReleaseSafe control on GitHub's arm64 runners.
on:
  pull_request:
    paths:
      - .github/workflows/pgso-linux-startup-diagnostic.yml

permissions:
  actions: read
  contents: read

env:
  AI_GATEWAY_API_KEY: ""
  VERCEL_OIDC_TOKEN: ""
  FX_SOUND: "0"

jobs:
  diagnose:
    name: Linux arm64 startup diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: pgso-linux-startup-diagnostic

      - name: Build the ReleaseSafe control
        run: zig build -Dtarget=aarch64-linux -Doptimize=ReleaseSafe -Dupdate-channel=stable --prefix "$RUNNER_TEMP/control"

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pgso-linux-arm64-5f92312447e383f76c5737f1a9ad4ee5c8a5bbfe-attempt-1
          run-id: 40946867920
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-artifact

      - name: Describe the runner
        run: |
          uname -a
          lscpu
          echo "page size: $(getconf PAGESIZE)"
          echo "transparent hugepages: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "fault_around_bytes: $(sudo cat /sys/kernel/debug/fault_around_bytes 2>&1)"
          echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid)"
          ls -l "$RUNNER_TEMP/control/bin/fx" "$RUNNER_TEMP/candidate-artifact/candidate/fx"

      - name: Time each page-cache state
        run: |
          d="$RUNNER_TEMP/diag"
          mkdir -p "$d/home"
          control="$RUNNER_TEMP/control/bin/fx"
          candidate="$RUNNER_TEMP/candidate-artifact/candidate/fx"
          chmod +x "$candidate"
          cat > "$d/measure.py" <<'PY'
          import resource, statistics, subprocess, sys, time
          label, control, candidate, home = sys.argv[1:5]
          env = {"HOME": home, "PATH": "/usr/bin:/bin", "FX_SOUND": "0", "FX_AUTO_UPGRADE": "0"}
          for args in (["help"], ["--version"]):
              rows = {control: ([], []), candidate: ([], [])}
              for i in range(320):
                  for path in ((control, candidate) if i % 2 == 0 else (candidate, control)):
                      before = resource.getrusage(resource.RUSAGE_CHILDREN)
                      start = time.perf_counter_ns()
                      subprocess.run([path, *args], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                      elapsed = (time.perf_counter_ns() - start) / 1000
                      after = resource.getrusage(resource.RUSAGE_CHILDREN)
                      if i >= 20:
                          rows[path][0].append(elapsed)
                          rows[path][1].append(after.ru_minflt - before.ru_minflt)
              c, k = rows[control], rows[candidate]
              m = statistics.median
              print(f"[{label}] {' '.join(args):10s} wall p50 control {m(c[0]):6.1f}us candidate {m(k[0]):6.1f}us ({m(k[0]) / m(c[0]) - 1:+.1%})"
                    f"  minor faults control {m(c[1]):.0f} candidate {m(k[1]):.0f}", flush=True)
          PY
          drop() { sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null; }
          state() { rm -rf "${d:?}/$1"; mkdir -p "$d/$1"; }

          # Both binaries freshly written.
          state fresh; cp "$control" "$d/fresh/control"; cp "$candidate" "$d/fresh/candidate"
          python3 "$d/measure.py" both-written "$d/fresh/control" "$d/fresh/candidate" "$d/home"

          # Both binaries read back from disk.
          state disk; cp "$control" "$d/disk/control"; cp "$candidate" "$d/disk/candidate"; drop
          python3 "$d/measure.py" both-read "$d/disk/control" "$d/disk/candidate" "$d/home"

          # The gate's state: the control was built hours earlier, the candidate just linked.
          state gate; cp "$control" "$d/gate/control"; drop; "$d/gate/control" --version >/dev/null
          cp "$candidate" "$d/gate/candidate"
          python3 "$d/measure.py" control-read-candidate-written "$d/gate/control" "$d/gate/candidate" "$d/home"

          # The reverse.
          state reverse; cp "$candidate" "$d/reverse/candidate"; drop; "$d/reverse/candidate" --version >/dev/null
          cp "$control" "$d/reverse/control"
          python3 "$d/measure.py" control-written-candidate-read "$d/reverse/control" "$d/reverse/candidate" "$d/home"
