name: Linux arm64 startup diagnostic

# Temporary: measures why the Linux arm64 PGSO candidate from run 40946867920
# starts slower than the ReleaseSafe control on GitHub's arm64 runners.
on:
  pull_request:
    paths:
      - .github/workflows/pgso-linux-startup-diagnostic.yml

permissions:
  actions: read
  contents: read

env:
  AI_GATEWAY_API_KEY: ""
  VERCEL_OIDC_TOKEN: ""
  FX_SOUND: "0"

jobs:
  diagnose:
    name: Linux arm64 startup diagnostic
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.0"
          cache-key: pgso-linux-startup-diagnostic

      - name: Build the ReleaseSafe control
        run: zig build -Dtarget=aarch64-linux -Doptimize=ReleaseSafe -Dupdate-channel=stable --prefix "$RUNNER_TEMP/control"

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pgso-linux-arm64-5f92312447e383f76c5737f1a9ad4ee5c8a5bbfe-attempt-1
          run-id: 40946867920
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-artifact

      - name: Describe the runner
        run: |
          uname -a
          lscpu
          echo "page size: $(getconf PAGESIZE)"
          echo "transparent hugepages: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "fault_around_bytes: $(sudo cat /sys/kernel/debug/fault_around_bytes 2>&1)"
          echo "perf_event_paranoid: $(cat /proc/sys/kernel/perf_event_paranoid)"
          ls -l "$RUNNER_TEMP/control/bin/fx" "$RUNNER_TEMP/candidate-artifact/candidate/fx"

      - name: Time and count page faults
        run: |
          d="$RUNNER_TEMP/diag"
          mkdir -p "$d/home"
          cp "$RUNNER_TEMP/control/bin/fx" "$d/control"
          cp "$RUNNER_TEMP/candidate-artifact/candidate/fx" "$d/candidate"
          chmod +x "$d/control" "$d/candidate"
          cat > "$d/measure.py" <<'PY'
          import os, resource, statistics, subprocess, sys, time
          d = sys.argv[1]
          label = sys.argv[2]
          env = {"HOME": f"{d}/home", "PATH": "/usr/bin:/bin", "FX_SOUND": "0", "FX_AUTO_UPGRADE": "0"}
          for args in (["help"], ["--version"], ["status", "--json"]):
              rows = {"control": ([], []), "candidate": ([], [])}
              for i in range(400):
                  order = ("control", "candidate") if i % 2 == 0 else ("candidate", "control")
                  for name in order:
                      before = resource.getrusage(resource.RUSAGE_CHILDREN)
                      start = time.perf_counter_ns()
                      subprocess.run([f"{d}/{name}", *args], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True)
                      elapsed = (time.perf_counter_ns() - start) / 1000
                      after = resource.getrusage(resource.RUSAGE_CHILDREN)
                      if i >= 20:
                          rows[name][0].append(elapsed)
                          rows[name][1].append(after.ru_minflt - before.ru_minflt)
              c, k = rows["control"], rows["candidate"]
              p50 = lambda xs: statistics.median(xs)
              print(f"[{label}] {' '.join(args):14s} wall p50 control {p50(c[0]):7.1f}us candidate {p50(k[0]):7.1f}us ({p50(k[0]) / p50(c[0]) - 1:+.1%})"
                    f"  minor faults control {p50(c[1]):.0f} candidate {p50(k[1]):.0f}", flush=True)
          PY
          python3 "$d/measure.py" "$d" "default"
          if sudo test -w /sys/kernel/debug/fault_around_bytes; then
            original="$(sudo cat /sys/kernel/debug/fault_around_bytes)"
            for bytes in 4096 65536; do
              echo "$bytes" | sudo tee /sys/kernel/debug/fault_around_bytes >/dev/null
              python3 "$d/measure.py" "$d" "fault_around=$bytes"
            done
            echo "$original" | sudo tee /sys/kernel/debug/fault_around_bytes >/dev/null
          fi

      - name: Count with perf
        continue-on-error: true
        run: |
          d="$RUNNER_TEMP/diag"
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" linux-tools-common >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-azure linux-tools-common >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1
          perf list hw 2>&1 | head -20
          for args in "help" "--version"; do
            for name in control candidate; do
              echo "== $name $args"
              HOME="$d/home" perf stat -r 200 \
                -e task-clock,page-faults,cycles,instructions,branch-misses,L1-icache-load-misses,iTLB-load-misses \
                -- "$d/$name" $args 2>&1 >/dev/null | grep -v -E '^\s*$'
            done
          done
