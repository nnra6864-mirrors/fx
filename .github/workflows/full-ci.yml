name: Intel quit diagnostics

on:
  push:
    branches: [fazxes/trace-intel-quit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intel-quit-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Trace terminal exit on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_SOUND: "0"
      FX_E2E_DISABLE_DOTENV: "1"
      FX_REQUIRE_TMUX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          use-cache: false
      - name: Build the tested source
        run: zig build -Doptimize=ReleaseSafe
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Match terminal setup
        run: |
          if ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          mkdir -p "$RUNNER_TEMP/quit-diagnostics"
          git log -1 --format='%H%n%P' > "$RUNNER_TEMP/quit-diagnostics/identity.txt"
          shasum -a 256 ./zig-out/bin/fx >> "$RUNNER_TEMP/quit-diagnostics/identity.txt"
          uname -a >> "$RUNNER_TEMP/quit-diagnostics/identity.txt"
          bun --version >> "$RUNNER_TEMP/quit-diagnostics/identity.txt"
          tmux -V >> "$RUNNER_TEMP/quit-diagnostics/identity.txt"
      - name: Install test dependencies
        working-directory: tests/e2e
        run: bun install --frozen-lockfile
      - name: Observe the unchanged render-stress test
        shell: bash
        run: |
          set -o pipefail
          overall=0
          for attempt in 1 2 3; do
            evidence="$RUNNER_TEMP/quit-diagnostics/attempt-$attempt"
            socket_root="$RUNNER_TEMP/quit-tmux-$attempt"
            mkdir -p "$evidence" "$socket_root"
            if FX_QUIT_DIAGNOSTICS_DIR="$evidence" TMUX_TMPDIR="$socket_root" bun test --max-concurrency 1 ./tests/e2e/fixtures/quit-diagnostics.test.ts 2>&1 | tee "$evidence/test.log"; then
              printf '0\n' > "$evidence/test-exit.txt"
            else
              status=$?
              printf '%s\n' "$status" > "$evidence/test-exit.txt"
              overall=1
            fi
            TMUX_TMPDIR="$socket_root" tmux kill-server 2>/dev/null || true
          done
          exit "$overall"
      - name: Retain process and terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-quit-diagnostics
          path: ${{ runner.temp }}/quit-diagnostics
          if-no-files-found: error
          retention-days: 7
